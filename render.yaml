# Servya — Render Static Site (CDN). Not a Web Service.
# Dashboard: New → Static Site  OR  New → Blueprint (this file)
# SPA: without the rewrite below, /restra-owner etc. 404 on refresh.
# If this site was created in the Dashboard (not Blueprint), add the same rule under
# Settings → Redirects/Rewrites: Source /*  Destination /index.html  Action Rewrite
services:
  - type: web
    name: restaurant-rms-1
    runtime: static
    branch: feat/premium-home
    buildCommand: npm install && CI=false npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: CI
        value: "false"
      - key: REACT_APP_API_URL
        value: https://api.schoolabe.com/api/v1/rms
      - key: REACT_APP_ENVIRONMENT
        value: production
      - key: REACT_APP_DEBUG_MODE
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # BUG-010 — browser security headers for the Servya SPA
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com; connect-src 'self' https://api.schoolabe.com https://*.onrender.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com"
