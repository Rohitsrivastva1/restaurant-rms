# Servya frontend — Render Static Site
# Dashboard: New → Blueprint → connect this repo, or create a Static Site manually.
services:
  - type: web
    name: servya-web
    runtime: static
    rootDir: .
    # Install deps first — Render does not run npm install for static sites by default.
    buildCommand: npm install --include=dev && CI=false npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://api.schoolabe.com/api/v1/rms
      - key: REACT_APP_ENVIRONMENT
        value: production
      - key: REACT_APP_DEBUG_MODE
        value: "false"
      - key: CI
        value: "false"
      - key: NODE_VERSION
        value: "20.19.0"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
